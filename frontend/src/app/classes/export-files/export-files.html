<section>
    <div>
        <label for="xmlContent">XML-Konfiguration:</label>
    </div>
    <div>
        <textarea id="xmlContent" [textContent]="xmlText" class="xml-result" readonly></textarea>
    </div>
    <div class="file-actions">
        <button class="file-action" type="button" (click)="copyToClipboard()">XML in die Zwischenablage kopieren</button>
        @if (fileUrl) {
            <a [href]="fileUrl" class="file-action" [download]="'Import ' + store.selectedClass()!.displayNames.de + '.xml'">XML als Datei herunterladen</a>
        }
        @if (xlFileUrl) {
            <a [href]="xlFileUrl" class="file-action" [download]="xlFileName">Excel-Vorlage herunterladen</a>
        }
    </div>
</section>
