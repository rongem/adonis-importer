server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # build output file names contain a content hash, so they can be cached forever
    # (files from public/ like favicon.ico are not hashed and use the default)
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # deliver index.html for all application routes (e.g. /classes after a reload)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
